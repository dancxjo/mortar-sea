[package]
name = "mortar-sea"
version = "0.1.0"
edition = "2024"
default-run = "mortar-sea"

[workspace]
members = [".", "psyche", "speech", "face", "asr-worker"]
resolver = "2"

[patch.crates-io]
llama-cpp-sys-4 = { path = "target/patched-crates/llama-cpp-sys-4" }

[features]
default = ["llama-cuda"]
llama-cuda = ["psyche/llama-cuda"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
inquire = "0.9.4"
owo-colors = "4"
psyche = { path = "psyche", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
