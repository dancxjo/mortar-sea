[package]
name = "mortar-sea"
version = "0.1.0"
edition = "2024"
default-run = "mortar-sea"

[workspace]
members = [".", "psyche", "face"]
resolver = "2"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
inquire = "0.9.4"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
