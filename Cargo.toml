[package]
name = "mortar-sea"
version = "0.1.0"
edition = "2024"
default-run = "mortar-sea"

[workspace]
members = [".", "psyche", "speech", "styletts2", "face", "ear"]
resolver = "2"

[patch.crates-io]
llama-cpp-sys-4 = { path = "target/patched-crates/llama-cpp-sys-4" }

[features]
default = ["llm-test", "llama-cuda", "styletts2-onnx", "piper-onnx"]
llm-test = ["dep:psyche"]
llama-cuda = ["llm-test", "psyche/llama-cuda"]
styletts2-onnx = ["styletts2/styletts2-onnx"]
piper-onnx = ["dep:ort"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
inquire = "0.9.4"
owo-colors = "4"
psyche = { path = "psyche", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
speech = { path = "speech" }
styletts2 = { path = "styletts2" }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dependencies.ort]
version = "=2.0.0-rc.12"
optional = true
default-features = false
features = ["load-dynamic", "api-23"]
