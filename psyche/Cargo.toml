[package]
name = "psyche"
version = "0.1.0"
edition = "2024"
description = "Core cognitive model for mortar-sea"

[features]
default = ["llama-cuda"]
llama-cuda = ["llama-cpp-4/cuda", "llama-cpp-sys-4/cuda"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dependencies.llama-cpp-4]
version = "0.3.0"
default-features = false
features = ["openmp"]

[dependencies.llama-cpp-sys-4]
version = "0.3.0"
default-features = false
features = ["openmp"]
