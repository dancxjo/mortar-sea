[package]
name = "psyche"
version = "0.1.0"
edition = "2024"
description = "Core cognitive model for mortar-sea"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dependencies.llama-cpp-2]
git = "https://github.com/utilityai/llama-cpp-rs.git"
rev = "6feffc60b5277b1fb9a718857736194cfdc736ac"
default-features = false
features = ["sampler"]

[dependencies.llama-cpp-sys-2]
git = "https://github.com/utilityai/llama-cpp-rs.git"
rev = "6feffc60b5277b1fb9a718857736194cfdc736ac"
default-features = false
