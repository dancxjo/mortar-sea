[package]
name = "mortar-core"
version = "0.1.0"
edition = "2021"
description = "Core cognitive model for mortar-sea"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
