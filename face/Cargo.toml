[package]
name = "face"
version = "0.1.0"
edition = "2024"
description = "Browser Face frontend and WebSocket ingestion server for mortar-sea"

[features]
default = ["llama-cuda"]
llama-cuda = ["psyche/llama-cuda"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
face_id = { version = "0.4.1", default-features = false, features = ["download-binaries", "copy-dylibs", "hf-hub"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }
psyche = { path = "../psyche", default-features = false }
mortar-sea = { path = "..", default-features = false, features = ["piper-onnx"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
