<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mortar Align</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script defer src="/static/app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Pete Mortar-Sea</p>
          <h1>Align</h1>
        </div>
        <div class="transport">
          <button type="button" id="zoom-out" title="Zoom out">-</button>
          <button type="button" id="zoom-in" title="Zoom in">+</button>
          <button type="button" id="fit" title="Fit timeline">Fit</button>
          <div class="status" id="status">Ready</div>
        </div>
      </header>

      <section class="control-strip" aria-label="Alignment controls">
        <div class="field text-field control-primary">
          <label for="text">Text</label>
          <textarea id="text" spellcheck="true">hello world</textarea>
        </div>
        <div class="field-group control-settings">
          <div class="field compact-field">
            <label for="variety">Variety</label>
            <input id="variety" name="variety" value="en-US" autocomplete="off" />
          </div>
        </div>
        <div class="button-stack control-actions">
          <label class="file-button" for="wav-file">Upload WAV</label>
          <input id="wav-file" type="file" accept="audio/wav,.wav" />
          <button type="button" id="record">Record</button>
          <button type="button" id="stop-recording" disabled>Stop</button>
        </div>
      </section>

      <section class="voice-panel" aria-labelledby="voice-heading">
        <header>
          <h2 id="voice-heading">Voice</h2>
          <span id="voice-detail">Drop WAVs in voices/styletts2</span>
        </header>
        <div class="voice-grid">
          <div class="field">
            <label for="backend">Renderer</label>
            <select id="backend" aria-label="Renderer">
              <option value="mock">mock</option>
              <option value="piper">piper</option>
              <option value="styletts2" selected>styletts2</option>
            </select>
          </div>
          <div class="field">
            <label for="styletts2-voice">Speaker WAV</label>
            <select id="styletts2-voice">
              <option value="">default speaker</option>
            </select>
          </div>
          <div class="field">
            <label for="styletts2-style">Style WAV</label>
            <select id="styletts2-style">
              <option value="">default style</option>
            </select>
          </div>
          <button type="button" id="refresh-voices" title="Refresh WAV list">Refresh WAVs</button>
        </div>
        <details class="voice-details">
          <summary>Add WAV</summary>
          <div class="voice-actions">
            <label class="file-button" for="styletts2-voice-file">Upload</label>
            <input id="styletts2-voice-file" type="file" accept="audio/wav,.wav" />
            <button type="button" id="record-styletts2-voice">Record</button>
            <button type="button" id="stop-styletts2-voice-recording" disabled>Stop</button>
          </div>
        </details>
      </section>

      <audio id="audio" preload="metadata"></audio>
      <section class="audio-strip" aria-label="Audio playback">
        <div class="audio-time" id="audio-position">0.00s</div>
        <div class="audio-progress" id="audio-progress" role="slider" aria-label="Audio position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="audio-progress-fill" id="audio-progress-fill"></div>
          <div class="audio-progress-thumb" id="audio-progress-thumb"></div>
        </div>
        <div class="audio-time" id="audio-duration">0.00s</div>
        <div class="audio-detail" id="audio-detail">No audio loaded</div>
      </section>

      <section class="transcription-panel" aria-label="IPA transcription">
        <article class="transcription-card">
          <header>
            <h2>IPA transcription</h2>
            <span id="phoneme-detail">Waiting</span>
            <button type="button" id="phonemicize">Phonemicize</button>
          </header>
          <dl class="transcription-readout">
            <div><dt>Phonemes</dt><dd id="phonemes"></dd></div>
            <div><dt>Phonetic realization</dt><dd id="syllables"></dd></div>
            <div><dt>Warnings</dt><dd id="warnings"></dd></div>
          </dl>
        </article>
      </section>

      <section class="daw-toolbar" aria-label="DAW actions">
        <button type="button" id="synthesize">Synthesize</button>
        <button type="button" id="audio-play-toggle" title="Play audio">Play</button>
      </section>

      <section class="daw">
        <section class="timeline" id="timeline">
          <div class="timeline-content" id="timeline-content">
            <canvas id="ruler" height="34"></canvas>
            <canvas id="waveform" height="176"></canvas>
            <canvas id="spectrogram" height="150"></canvas>
            <canvas id="feature-track" height="42"></canvas>
            <canvas id="projected-voicing-track" height="42"></canvas>
            <canvas id="candidate-overlay-track" height="54"></canvas>
            <canvas id="word-track" height="54"></canvas>
            <canvas id="phoneme-track" height="66"></canvas>
            <canvas id="phone-track" height="54"></canvas>
          </div>
        </section>
      </section>

      <section class="secondary-grid">
        <article>
          <header>
            <h2>ASR</h2>
            <span id="alignment-detail">No alignment</span>
            <button type="button" id="align">Align ASR</button>
          </header>
          <pre id="asr"></pre>
        </article>
        <article>
          <header>
            <h2>Speech IR</h2>
            <button type="button" id="toggle-ir">Show</button>
          </header>
          <pre id="ir" hidden></pre>
        </article>
      </section>
    </main>
  </body>
</html>
