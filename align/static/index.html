<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mortar Align</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <script defer src="/static/app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Pete Mortar-Sea</p>
          <h1>Align</h1>
        </div>
        <div class="transport">
          <div class="field topbar-variety">
            <label for="variety">Linguistic Variety</label>
            <input id="variety" name="variety" value="en-US" autocomplete="off" />
          </div>
          <div class="status" id="status">Ready</div>
        </div>
      </header>

      <section class="transcript-panel" aria-labelledby="transcript-heading">
        <header>
          <h2 id="transcript-heading">Transcribe</h2>
          <div class="transcript-controls">
            <span id="phoneme-detail">Waiting</span>
            <span id="alignment-detail">No alignment</span>
            <button type="button" id="phonemicize" title="Phonemicize">Phonemicize</button>
            <button type="button" id="align" title="Align ASR">Align ASR</button>
          </div>
        </header>
        <div class="transcription-stack">
          <div class="transcription-field">
            <label for="text">Orthographic</label>
            <textarea id="text" spellcheck="true">hello world</textarea>
          </div>
          <div class="transcription-field">
            <label for="phonemes">Phonemic</label>
            <textarea id="phonemes" readonly></textarea>
          </div>
          <div class="transcription-field">
            <label for="syllables">Phonetic</label>
            <textarea id="syllables" readonly></textarea>
          </div>
          <div class="transcription-field">
            <label for="asr">ASR</label>
            <textarea id="asr" readonly></textarea>
          </div>
        </div>
      </section>

      <section class="control-row" aria-label="Audio controls">
        <section class="voice-panel control-panel synthesis-panel" aria-labelledby="synthesis-heading">
          <header>
            <h2 id="synthesis-heading">Synthesize</h2>
            <span id="voice-detail">Drop WAVs in voices/styletts2</span>
          </header>
          <div class="voice-grid">
            <div class="field">
              <label for="backend">Renderer</label>
              <select id="backend" aria-label="Renderer">
                <option value="mock">mock</option>
                <option value="piper">piper</option>
                <option value="styletts2" selected>styletts2</option>
              </select>
            </div>
            <div class="field">
              <label for="styletts2-voice">Speaker WAV</label>
              <select id="styletts2-voice">
                <option value="">default speaker</option>
              </select>
            </div>
            <div class="field">
              <label for="styletts2-style">Style WAV</label>
              <select id="styletts2-style">
                <option value="">default style</option>
              </select>
            </div>
            <button type="button" id="refresh-voices" class="icon-button" title="Refresh WAV list" aria-label="Refresh WAV list"><i data-lucide="refresh-cw" aria-hidden="true">&#8635;</i></button>
            <button type="button" id="synthesize" class="labeled-icon-button" title="Synthesize audio" aria-label="Synthesize audio"><i data-lucide="zap" aria-hidden="true">&#9889;</i><span>Synthesize</span></button>
          </div>
          <details class="voice-details">
            <summary>Add speaker WAV</summary>
            <div class="voice-actions">
              <label id="styletts2-voice-upload-control" class="file-button labeled-icon-button" for="styletts2-voice-file" title="Upload voice WAV" aria-label="Upload voice WAV"><i data-lucide="upload" aria-hidden="true">&#8679;</i><span>Upload</span></label>
              <input id="styletts2-voice-file" type="file" accept="audio/wav,.wav" />
              <button type="button" id="record-styletts2-voice" class="labeled-icon-button" title="Record voice sample" aria-label="Start recording voice sample" aria-pressed="false" data-state="idle"><i data-lucide="circle" aria-hidden="true">&#9679;</i><span>Record</span></button>
            </div>
          </details>
        </section>

        <section class="control-panel audio-input-panel" aria-labelledby="audio-input-heading">
          <header>
            <h2 id="audio-input-heading">Provide your own</h2>
            <span>Add source WAV</span>
          </header>
          <div class="audio-source-controls" aria-label="Add audio">
            <label id="wav-upload-control" class="file-button labeled-icon-button" for="wav-file" title="Upload WAV" aria-label="Upload WAV"><i data-lucide="upload" aria-hidden="true">&#8679;</i><span>Upload</span></label>
            <input id="wav-file" type="file" accept="audio/wav,.wav" />
            <button type="button" id="record" class="labeled-icon-button" title="Record audio" aria-label="Start recording audio" aria-pressed="false" data-state="idle"><i data-lucide="circle" aria-hidden="true">&#9679;</i><span>Record</span></button>
          </div>
        </section>
      </section>

      <audio id="audio" preload="metadata"></audio>
      <section class="audio-strip" aria-label="Audio playback">
        <div class="audio-time" id="audio-position">0.00s</div>
        <div class="audio-progress" id="audio-progress" role="slider" aria-label="Audio position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="audio-progress-fill" id="audio-progress-fill"></div>
          <div class="audio-progress-thumb" id="audio-progress-thumb"></div>
        </div>
        <div class="audio-time" id="audio-duration">0.00s</div>
        <div class="audio-detail" id="audio-detail">No audio loaded</div>
      </section>

      <section class="daw-toolbar" aria-label="DAW actions">
        <div class="timeline-controls" aria-label="Timeline zoom">
          <button type="button" id="zoom-out" title="Zoom out" aria-label="Zoom out"><i data-lucide="zoom-out" aria-hidden="true">-</i></button>
          <button type="button" id="zoom-in" title="Zoom in" aria-label="Zoom in"><i data-lucide="zoom-in" aria-hidden="true">+</i></button>
          <button type="button" id="fit" title="Fit timeline" aria-label="Fit timeline"><i data-lucide="maximize" aria-hidden="true">&#9974;</i></button>
        </div>
        <div class="playback-controls" aria-label="Playback">
          <button type="button" id="audio-play-toggle" title="Paused - play audio" aria-label="Paused - play audio" aria-pressed="false" data-state="paused"><i data-lucide="play" aria-hidden="true">&#9654;</i></button>
        </div>
      </section>

      <section class="daw">
        <section class="timeline" id="timeline">
          <div class="timeline-content" id="timeline-content">
            <canvas id="ruler" height="34"></canvas>
            <canvas id="waveform" height="176"></canvas>
            <canvas id="spectrogram" height="150"></canvas>
            <canvas id="vad-track" height="34"></canvas>
            <canvas id="feature-track" height="42"></canvas>
            <canvas id="projected-voicing-track" height="42"></canvas>
            <canvas id="candidate-overlay-track" height="54"></canvas>
            <canvas id="word-track" height="54"></canvas>
            <canvas id="phoneme-track" height="66"></canvas>
            <canvas id="phone-track" height="54"></canvas>
          </div>
        </section>
      </section>

      <section class="secondary-grid">
        <article>
          <header>
            <h2>Speech IR</h2>
            <button type="button" id="toggle-ir" class="icon-button" title="Show Speech IR" aria-label="Show Speech IR"><i data-lucide="chevron-right" aria-hidden="true">&#9656;</i></button>
          </header>
          <pre id="ir" hidden></pre>
        </article>
      </section>
    </main>
  </body>
</html>
