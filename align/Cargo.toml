[package]
name = "align"
version = "0.1.0"
edition = "2024"
description = "Browser alignment input surface for mortar-sea speech experiments"

[features]
default = ["styletts2-onnx", "piper-onnx"]
styletts2-onnx = ["mortar-sea/styletts2-onnx"]
piper-onnx = ["mortar-sea/piper-onnx"]

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["multipart"] }
mortar-sea = { path = "..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
speech = { path = "../speech" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
